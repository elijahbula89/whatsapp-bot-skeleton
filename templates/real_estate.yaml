# REAL ESTATE AGENT TEMPLATE
# Copy this file to clients/<business-name>/settings.yaml and fill it in.
# Lines starting with # are notes for you; the bot ignores them.
# If something isn't in this file, the bot will NOT make it up; it hands over to the agent.

# --- Program settings (not shown to customers) ---
whatsapp_phone_number_id: "PASTE_FROM_META"
staff_whatsapp: "679XXXXXXX"

# --- About the business ---
business: Agency Name
industry: real estate agency
location: Office address
phone: "+679 XXX XXXX"
office_hours: Mon-Fri 8:30am - 5pm, Sat by appointment
tone: professional and friendly; greet with "Bula"

listings:
  - ref: SV-101
    type: 3-bedroom house for sale
    area: Tamavua, Suva
    price: FJD 650,000
    details: "Freehold, 2 bathrooms, garage, sea view"
  - ref: NR-204
    type: 2-bedroom flat for rent
    area: Nadi town
    price: FJD 1,400 per month
    details: "Furnished, available from 1 November"

viewings: "Ask for name, which listing, and preferred days; the agent confirms the time."
buyer_leads: "For people looking to buy or rent: ask area, budget, bedrooms and timeframe, then pass to the agent."

faqs:
  - q: Can foreigners buy land in Fiji?
    a: "Refer to the agent; do not give legal advice."

phrases:
  itaukei:
    welcome: "Bula vinaka! ..."
  fiji_hindi:
    welcome: "..."

never_say:
  - Legal, tax or finance advice
  - That a property is still available or an offer is accepted (the agent confirms)
